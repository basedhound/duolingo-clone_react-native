[project]
name = "vision-agent"
version = "0.1.0"
description = "AI language teacher — voice-only agent using OpenAI Realtime + Stream Edge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "vision-agents[getstream,openai]>=0.5.7",
]

[tool.uv.scripts]
run = "python main.py run"
serve = "python main.py serve"
